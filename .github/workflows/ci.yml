name: CI/CD

on:
  push:
    branches: [main, dev]

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run test

      # build WITHOUT secrets (important)
      - run: npm run build
        env:
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:
            ${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          NEXT_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_URL }}
          SKIP_DB_ON_BUILD: true

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: ci
    # Deploy only from main; dev just gets CI checks above.
    if: github.ref == 'refs/heads/main'

    steps:
      # Server builds the image itself from the repo (matches the manual
      # process this was validated with) — no image transfer over SCP.
      # .env with runtime/prod secrets already lives on the server at
      # /opt/advocate/.env and is untouched by this deploy.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/advocate
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
